<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FromZeroToDungeon</title>

  <style>
  body {
    position: relative;
    background-image: url("Sfondo.JPG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #f5f5f5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 10vh;
    min-height: 100vh;
    margin: 0;
    text-align: center;
  }
    
  logo {
    width: 40px;
    height: auto;
    margin-bottom: 5px;
}
    
  /* Overlay scuro */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
  z-index: 0;
}

  .container {
    position: relative;
    z-index: 1;
    max-width: 500px;
    padding: 30px;

    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    border-radius: 16px;
    border: 3px solid rgba(255,255,255,0.25);
  }
    
  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  h2 {
    font-size: 1.5rem;
    margin-bottom: 10px;
  }

  h3 {
    font-size: 1.1rem;
    margin-bottom: 10px;
  }

  p {
    opacity: 0.9;
    line-height: 1.5;
  }

  .links {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  a {
    color: white;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 12px;
    border-radius: 8px;
    transition: 0.2s;
    background: rgba(255,255,255,0.05);
  }

  a:hover {
    background: rgba(255,255,255,0.15);
  }
    .projects {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.project-card {
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: white;
  overflow: hidden;

  background: rgba(255,255,255,0.05);
  border-radius: 10px;

  transition: transform 0.2s;
}

.project-card:hover {
  transform: scale(1.03);
}

.project-card img {
  width: 100%;
  aspect-ratio: 580 / 782;
  object-fit: cover;
}

.project-card span {
  padding: 10px;
  font-size: 0.9rem;
}

.footer {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.15);
  font-size: 0.75rem;
  opacity: 0.6;
}
    
</style>
</head>
<body>

<div class="container">
      
 <img src="Logo new.png" alt="FromZeroToDungeon Logo" class="logo">
  
  <h2>Benvenuti!</h2>
  
  <p>
 Trasformo idee in oggetti, prop e accessori per portare più immersione al tavolo da gioco.
</p>

  <div class="links">
    <a href="https://www.instagram.com/fromzerotodungeon/">Instagram</a>
    <a href="https://www.tiktok.com/@fromzerotodungeon">TikTok</a>
    <a href="https://www.youtube.com/@FromZerotoDungeon">YouTube</a>
    <a href="https://www.patreon.com/cw/FromZerotoDungeon/">Patreon</a>
    <a href="mailto:fromzerotodungeon@gmail.com?subject=Contatto dal sito FromZeroToDungeon">Contattami</a>

  </div>
    
    <h3>Progetti in evidenza</h3>

<div class="projects">

  <a class="project-card" href="https://www.instagram.com/p/DXmi1CKjRyN/">
    <img src="Battlemap.png" alt="Battle Map">
    <span>Battle Map economici</span>
  </a>

  <a class="project-card" href="https://www.instagram.com/p/DYchg4PNBuW/">
    <img src="Fireball.png" alt="Fireball">
    <span>Castiamo Fireball</span>
  </a>

  <a class="project-card" href="https://www.instagram.com/p/DYNLv2Gtw_C/">
    <img src="Fumo.png" alt="Macchina del Fumo">
    <span>Macchina del Fumo</span>
  </a>

  <a class="project-card" href="https://www.instagram.com/p/DPwSLyejMnY/">
    <img src="Modello.png" alt="Modello">
    <span>Modello Gratis</span>
  </a>
  
  </div>

  </div>
  <footer>© 2026 FromZerotoDungeon</footer>

  </div>
  
</body>
</html>
