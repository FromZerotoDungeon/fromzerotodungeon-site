<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FromZeroToDungeon</title>

  <style>
  body {
    position: relative;
    background-image: url("Sfondo.JPG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #f5f5f5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 10vh;
    height: 100vh;
    margin: 0;
    text-align: center;
  }

  /* Overlay scuro */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
  z-index: 0;
}

  .container {
    position: relative;
    z-index: 1;
    max-width: 500px;
    padding: 30px;

    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    border-radius: 16px;
    border: 3px solid rgba(255,255,255,0.25);
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  h3 {
    font-size: 1.2rem;
    margin-bottom: 10px;
  }

  p {
    opacity: 0.9;
    line-height: 1.5;
  }

  .links {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  a {
    color: white;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 12px;
    border-radius: 8px;
    transition: 0.2s;
    background: rgba(255,255,255,0.05);
  }

  a:hover {
    background: rgba(255,255,255,0.15);
  }
</style>
</head>
<body>

<div class="container">
  <h1>From Zero to Dungeon</h1>
  
  <h3>Benvenuti!</h3>
  
  <p>
 Trasformo idee in oggetti, prop e accessori per portare più immersione al tavolo da gioco.
</p>

  <div class="links">

  </div>
</div>

</body>
</html>
